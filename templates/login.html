<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDLHONI - چوونەژوورەوە</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top, #1a103c 0%, #0b071a 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">

    <div class="w-full max-w-md bg-[#130d2d]/80 border border-purple-500/30 backdrop-blur-md rounded-2xl p-8 shadow-2xl shadow-purple-900/30">
        
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-2 mb-2">
                <span class="text-amber-500 text-2xl">♦</span>
                <h1 class="text-3xl font-extrabold tracking-widest text-amber-400">M•D•L•H•O•N•I</h1>
                <span class="text-amber-500 text-2xl">♦</span>
            </div>
            <p class="text-sm text-gray-400 font-medium">سیستەمی پێشکەوتووی شیکاریی توکن بە AI</p>
        </div>

        <!-- Login Form -->
        <form action="/login" method="POST" class="space-y-6">
            
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-2">ناوی بەکارهێنەر (Username)</label>
                <input type="text" name="username" required placeholder="ناوی بەکارهێنەر بنووسە..." 
                    class="w-full bg-[#1e1543] border border-purple-500/30 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-2">هێمای تێپەڕبوون (Password)</label>
                <input type="password" name="password" required placeholder="••••••••" 
                    class="w-full bg-[#1e1543] border border-purple-500/30 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition">
            </div>

            <!-- Display Error if Login Fails -->
            {% if error %}
            <div class="bg-red-500/20 border border-red-500/50 text-red-300 text-xs p-3 rounded-lg text-center">
                {{ error }}
            </div>
            {% endif %}

            <button type="submit" 
                class="w-full py-3.5 px-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-orange-500/20 transition duration-200 transform hover:-translate-y-0.5">
                چوونەژوورەوە
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-purple-500/20 text-center text-xs text-gray-500">
            مافی ئەم بەرنامەیە پارێزراوە بۆ Agha Software © 2026
        </div>
    </div>

</body>
</html>
